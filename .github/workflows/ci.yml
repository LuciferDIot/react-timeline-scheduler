name: CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main, "overhaul/*"]

jobs:
  report-build-status:
    name: report-build-status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run lint
      - run: npm run test
      - run: npm run build
